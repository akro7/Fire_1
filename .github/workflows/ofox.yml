name: Build OrangeFox Recovery - Redmi fire (MT6768)

on:
  push:
    branches:
      - main
      - android-12.1
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force manual execution'
        required: false
        default: 'true'

jobs:
  build:
    name: Build OrangeFox for fire
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      DEVICE_CODENAME:      fire
      DEVICE_PATH:          device/xiaomi/fire
      MANIFEST_BRANCH:      12.1
      KERNEL_SOURCE_URL:    https://github.com/mkpromvp/Stock-rom-dumber
      KERNEL_SOURCE_BRANCH: dump-redmi-fire-os2.0.207.0.vmxmixm

    steps:
      # ── 1. Checkout device tree ──────────────────────────────────
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: ${{ env.DEVICE_PATH }}

      # ── 2. Free disk space ───────────────────────────────────────
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
                      /opt/ghc /usr/local/.ghcup
          sudo apt-get clean
          df -h

      # ── 3. Setup Java 11 (Strict Version Control) ────────────────
      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      # ── 4. Install dependencies ──────────────────────────────────
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
            libncurses5 lib32ncurses5-dev x11proto-core-dev \
            libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils \
            xsltproc unzip fontconfig python3 python3-pip bc \
            lzop pngcrush rsync schedtool ccache openjdk-11-jdk aria2

      # ── 5. Configure git ─────────────────────────────────────────
      - name: Configure git
        run: |
          git config --global user.name  "AKRO-Build"
          git config --global user.email "build@localhost"
          git config --global color.ui   false

      # ── 6. Install repo ──────────────────────────────────────────
      - name: Install repo
        run: |
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo \
            -o ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      # ── 7. Setup build environment ───────────────────────────────
      - name: Setup build environment
        run: |
          git clone https://gitlab.com/OrangeFox/misc/scripts /tmp/ofox_scripts
          cd /tmp/ofox_scripts
          sudo bash setup/android_build_env.sh

      # ── 8. Init & Sync OrangeFox manifest ────────────────────────
      - name: Init and Sync OrangeFox manifest
        run: |
          mkdir -p $GITHUB_WORKSPACE/OrangeFox_src
          git clone https://gitlab.com/OrangeFox/sync.git /tmp/ofox_sync
          cd /tmp/ofox_sync
          ./orangefox_sync.sh \
            --branch ${{ env.MANIFEST_BRANCH }} \
            --path $GITHUB_WORKSPACE/OrangeFox_src

      # ── 9. Place device tree ─────────────────────────────────────
      - name: Place device tree
        run: |
          DEST="$GITHUB_WORKSPACE/OrangeFox_src/${{ env.DEVICE_PATH }}"
          rm -rf "$DEST"
          cp -r "$GITHUB_WORKSPACE/${{ env.DEVICE_PATH }}" "$DEST"

      # ── 9.1 Fix obsolete variable names ──────────────────────────
      - name: Fix obsolete OF_TARGET_DEVICES variable
        run: |
          DEST="$GITHUB_WORKSPACE/OrangeFox_src/${{ env.DEVICE_PATH }}"
          echo "Fixing OF_TARGET_DEVICES → FOX_TARGET_DEVICES..."
          find "$DEST" -type f \( -name "*.mk" -o -name "*.sh" \) | \
            xargs grep -l "OF_TARGET_DEVICES" 2>/dev/null | \
            while read f; do
              sed -i 's/OF_TARGET_DEVICES/FOX_TARGET_DEVICES/g' "$f"
              echo "  Fixed: $f"
            done

      # ── 9.2 Patch BoardConfig for vendor_boot ────────────────────
      - name: Patch BoardConfig for vendor_boot (no recovery partition)
        run: |
          DEST="$GITHUB_WORKSPACE/OrangeFox_src/${{ env.DEVICE_PATH }}"
          BOARD_CFG="$DEST/BoardConfig.mk"
          if [ ! -f "$BOARD_CFG" ]; then
            echo "::error::BoardConfig.mk not found at $BOARD_CFG"
            exit 1
          fi
          echo "=== Patching BoardConfig.mk for vendor_boot ==="
          sed -i '/BOARD_USES_RECOVERY_AS_BOOT/d'              "$BOARD_CFG"
          sed -i '/BOARD_MOVE_RECOVERY_RESOURCES_TO_VENDOR_BOOT/d' "$BOARD_CFG"
          sed -i '/BOARD_INCLUDE_RECOVERY_RAMDISK_IN_VENDOR_BOOT/d' "$BOARD_CFG"
          sed -i '/TARGET_NO_RECOVERY/d'                        "$BOARD_CFG"
          echo "" >> "$BOARD_CFG"
          echo "BOARD_USES_RECOVERY_AS_BOOT             := false" >> "$BOARD_CFG"
          echo "TARGET_NO_RECOVERY                      := true" >> "$BOARD_CFG"
          echo "BOARD_MOVE_RECOVERY_RESOURCES_TO_VENDOR_BOOT := true" >> "$BOARD_CFG"
          echo "BOARD_INCLUDE_RECOVERY_RAMDISK_IN_VENDOR_BOOT := true" >> "$BOARD_CFG"
          echo "=== BoardConfig.mk patched ==="
          grep -E "RECOVERY|VENDOR_BOOT" "$BOARD_CFG"

      # ── 9.3 Patch device.mk for virtual A/B + vendor_boot ────────
      - name: Patch device.mk for virtual AB and vendor_boot
        run: |
          DEST="$GITHUB_WORKSPACE/OrangeFox_src/${{ env.DEVICE_PATH }}"
          DEV_MK=$(find "$DEST" -maxdepth 2 \( -name "device.mk" -o -name "omni_${{ env.DEVICE_CODENAME }}.mk" \) | head -1)
          if [ -z "$DEV_MK" ]; then
            echo "::warning::device.mk not found, creating minimal one..."
            DEV_MK="$DEST/device.mk"
            touch "$DEV_MK"
          fi
          echo "=== Patching $DEV_MK ==="
          if ! grep -q "virtual_ab_ota" "$DEV_MK"; then
            echo "" >> "$DEV_MK"
            echo "\$(call inherit-product, \$(SRC_TARGET_DIR)/product/virtual_ab_ota.mk)" >> "$DEV_MK"
          fi
          echo "=== device.mk patched ==="

      # ── 10. Prepare prebuilt kernel ───────────────────────────────
      - name: Prepare prebuilt kernel
        run: |
          PREBUILT_DIR="$GITHUB_WORKSPACE/OrangeFox_src/${{ env.DEVICE_PATH }}/prebuilt"
          if [ -f "$PREBUILT_DIR/kernel" ]; then
            echo "Kernel already present — skipping."
            exit 0
          fi
          echo "Cloning stock dump to extract kernel..."
          git clone --depth=1 --branch ${{ env.KERNEL_SOURCE_BRANCH }} ${{ env.KERNEL_SOURCE_URL }} /tmp/dump_repo
          VENDOR_BOOT=$(find /tmp/dump_repo -maxdepth 4 -name "vendor_boot.img" | head -1)
          BOOT_IMG=$(find /tmp/dump_repo -maxdepth 4 -name "boot.img" | head -1)
          mkdir -p "$PREBUILT_DIR"
          
          if [ -n "$VENDOR_BOOT" ]; then
            echo "Found vendor_boot.img — verification stage..."
            python3 - "$VENDOR_BOOT" "$PREBUILT_DIR/kernel" << 'PY'
import struct, sys
data = open(sys.argv[1], "rb").read()
assert data[:8] == b"VNDRBOOT", "Not a vendor_boot image!"
header_version = struct.unpack_from("<I", data, 8)[0]
print(f"vendor_boot v{header_version} verified.")
PY
            if [ -n "$BOOT_IMG" ]; then
              echo "Extracting kernel from boot.img..."
              python3 - "$BOOT_IMG" "$PREBUILT_DIR/kernel" << 'PY'
import struct, sys, os
boot = open(sys.argv[1], "rb").read()
assert boot[:8] == b"ANDROID!", "Not an Android boot image"
kernel_size = struct.unpack_from("<I", boot, 8)[0]
page_size   = struct.unpack_from("<I", boot, 12)[0]
kernel_data = boot[page_size : page_size + kernel_size]
open(sys.argv[2], "wb").write(kernel_data)
print(f"Kernel extracted successfully: {kernel_size} bytes")
PY
            fi
          elif [ -n "$BOOT_IMG" ]; then
            echo "No vendor_boot.img found, extracting kernel from boot.img directly..."
            python3 - "$BOOT_IMG" "$PREBUILT_DIR/kernel" << 'PY'
import struct, sys
boot = open(sys.argv[1], "rb").read()
assert boot[:8] == b"ANDROID!", "Not an Android boot image"
kernel_size = struct.unpack_from("<I", boot, 8)[0]
page_size   = struct.unpack_from("<I", boot, 12)[0]
kernel_data = boot[page_size : page_size + kernel_size]
open(sys.argv[2], "wb").write(kernel_data)
print(f"Kernel extracted directly: {kernel_size} bytes")
PY
          else
            echo "::warning::No boot.img or vendor_boot.img found. Commit prebuilt/kernel manually."
          fi
          
          if [ -n "$VENDOR_BOOT" ]; then
            cp "$VENDOR_BOOT" "$PREBUILT_DIR/vendor_boot.img"
            echo "vendor_boot.img copied to prebuilt folder."
          fi

      # ── 11. Apply MSMS decryption patches ────────────────────────
      - name: Apply MSMS decryption patches
        working-directory: OrangeFox_src
        run: |
          cd bootable/recovery
          git remote add ofox-upstream https://gitlab.com/OrangeFox/bootable/Recovery.git 2>/dev/null || true
          git fetch ofox-upstream fox_${{ env.MANIFEST_BRANCH }} --depth=1
          echo "OrangeFox Recovery upstream fetched."

      # ── 12. ccache ───────────────────────────────────────────────
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 2G
          key: ofox-fire-${{ env.MANIFEST_BRANCH }}

      # ── 13. Build vendor_boot ────────────────────────────────────
      - name: Build OrangeFox (vendor_boot)
        working-directory: OrangeFox_src
        run: |
          unset ANDROID_NDK_HOME
          unset ANDROID_NDK_ROOT
          unset ANDROID_NDK_LATEST_HOME
          
          export USE_CCACHE=1
          export CCACHE_EXEC=$(which ccache)
          export ALLOW_MISSING_DEPENDENCIES=true
          export BUILD_BROKEN_USES_BUILD_COPY_HEADERS=true
          export BUILD_BROKEN_VENDOR_PROPERTY_NAMESPACE=true
          
          set +e
          source build/envsetup.sh
          set -e
          lunch twrp_${{ env.DEVICE_CODENAME }}-eng
          mka adbd vendorbootimage -j$(nproc) 2>&1 | tee /tmp/build.log

      # ── 14. Rename output ────────────────────────────────────────
      - name: Rename output image
        run: |
          OUT_DIR="$GITHUB_WORKSPACE/OrangeFox_src/out/target/product/${{ env.DEVICE_CODENAME }}"
          TIMESTAMP=$(date +'%Y%m%d-%H%M')
          OUTFILE="OrangeFox-${{ env.MANIFEST_BRANCH }}-${{ env.DEVICE_CODENAME }}-AKRO-${TIMESTAMP}-vendor_boot.img"
          echo "=== Files in OUT_DIR ==="
          ls -lah "$OUT_DIR/" 2>/dev/null || echo "OUT_DIR not found: $OUT_DIR"
          if [ -f "$OUT_DIR/vendor_boot.img" ]; then
            cp "$OUT_DIR/vendor_boot.img" "$GITHUB_WORKSPACE/$OUTFILE"
            echo "RECOVERY_IMG=$GITHUB_WORKSPACE/$OUTFILE" >> $GITHUB_ENV
            echo "✓ vendor_boot.img found and renamed to $OUTFILE"
          else
            echo "::error::vendor_boot.img not found! Build failed."
            exit 1
          fi
          cp "$OUT_DIR/OrangeFox"*.zip "$GITHUB_WORKSPACE/" 2>/dev/null || true
          echo "OUT_DIR=$OUT_DIR"   >> $GITHUB_ENV
          echo "OUTFILE=$OUTFILE"   >> $GITHUB_ENV

      # ── 15. Upload artifacts ─────────────────────────────────────
      - name: Upload vendor_boot image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUTFILE }}
          path: |
            ${{ env.RECOVERY_IMG }}
            ${{ env.OUT_DIR }}/OrangeFox*.zip
          if-no-files-found: warn
          retention-days: 7

      # ── On failure: generate detailed report ─────────────────────
      - name: Generate Failure Report
        if: failure()
        run: |
          python3 - << 'EOF'
          import os, re
          from datetime import datetime
          def read(p):
              try:
                  with open(p, 'r', errors='ignore') as f: return f.read()
              except: return ""
          build_log = read("/tmp/build.log")
          now = datetime.now().strftime("%Y-%m-%d %H:%M:%S")
          lines = build_log.split('\n')
          error_keywords = ['error:', 'fatal error:', 'FAILED', 'Exception', 'Could not', 'not found', 'undefined reference', 'Caused by:', 'BUILD FAILED', 'is obsolete', 'ckati failed']
          errors = []
          for i, line in enumerate(lines):
              if any(k in line for k in error_keywords):
                  start = max(0, i - 2)
                  end   = min(len(lines), i + 8)
                  block = '\n'.join(lines[start:end])
                  if block not in errors:
                      errors.append(block)
          mk_errors    = re.findall(r'([^\s]+\.mk):(\d+):\s*(.+)', build_log)
          failed_tasks = re.findall(r'FAILED:\s*(.+)', build_log)
          report = []
          report.append("=" * 70)
          report.append("  ORANGEFOX BUILD FAILURE REPORT — fire (MT6768) vendor_boot")
          report.append(f"  Date: {now}")
          report.append("=" * 70)
          report.append("\n[ FAILED TASKS ]")
          report.append("-" * 70)
          if failed_tasks:
              for t in list(dict.fromkeys(failed_tasks))[:20]:
                  report.append(f"  x {t.strip()}")
          else:
              report.append("  No specific failed tasks found")
          report.append("\n[ MAKEFILE ERRORS ]")
          report.append("-" * 70)
          if mk_errors:
              seen = set()
              for file, line, msg in mk_errors[:30]:
                  key = f"{file}:{line}"
                  if key not in seen:
                      seen.add(key)
                      report.append(f"  File : {file}")
                      report.append(f"  Line : {line}")
                      report.append(f"  Error: {msg.strip()}")
                      report.append("")
          else:
              report.append("  No makefile errors found")
          report.append("\n[ ERROR BLOCKS ]")
          report.append("-" * 70)
          if errors:
              for i, err in enumerate(errors[:20], 1):
                  report.append(f"\n--- Error #{i} ---")
                  report.append(err)
          else:
              report.append("  No error blocks found")
          report.append("\n[ FULL BUILD LOG ]")
          report.append("-" * 70)
          report.append(build_log[-50000:] if len(build_log) > 50000 else build_log)
          report_text = '\n'.join(report)
          with open("BUILD_FAILURE_REPORT.txt", 'w') as f:
              f.write(report_text)
          print(report_text[:3000])
          EOF

      - name: Collect all logs on failure
        if: failure()
        run: |
          mkdir -p /tmp/fail_logs
          [ -f /tmp/build.log ]             && cp /tmp/build.log             /tmp/fail_logs/ || true
          [ -f BUILD_FAILURE_REPORT.txt ]   && cp BUILD_FAILURE_REPORT.txt   /tmp/fail_logs/ || true
          find $GITHUB_WORKSPACE/OrangeFox_src/out -name "*.log" 2>/dev/null | head -20 | xargs -I{} sh -c 'cp "{}" /tmp/fail_logs/$(basename "{}")' || true
          echo "=== ENV DUMP ===" > /tmp/fail_logs/env.log
          env >> /tmp/fail_logs/env.log

      - name: Upload all logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-fire-${{ github.run_number }}
          path: /tmp/fail_logs/
          retention-days: 7

      # ── 16. GitHub Release (tag only) ────────────────────────────
      - name: Create GitHub Release
        if: success() && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "OrangeFox fire AKRO Build #${{ github.run_number }}"
          body: |
            **Device:** Redmi 12 / fire (MT6768)
            **ROM Base:** HyperOS 2.0.207.0.VMXMIXM (Android 15)
            **OrangeFox branch:** ${{ env.MANIFEST_BRANCH }}
            **Maintainer:** AKRO — UNOFFICIAL
            **Type:** vendor_boot (no dedicated recovery partition)

            ### Flash
            ```
            fastboot flash vendor_boot OrangeFox-*-vendor_boot.img
            fastboot reboot recovery
            ```
            > ⚠️ A/B device — flash to vendor_boot, NOT boot or recovery
          files: |
            ${{ env.RECOVERY_IMG }}
            ${{ env.OUT_DIR }}/OrangeFox*.zip
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
