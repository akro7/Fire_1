name: Build Recovery - Redmi 12 (fire)

on:
  push:
    branches: [ main, android-12.1 ]
  workflow_dispatch:
    inputs:
      BUILD_TARGET:
        description: "Recovery to build"
        required: true
        default: "both"
        type: choice
        options:
          - orangefox
          - twrp
          - both

jobs:
  build:
    name: Build ${{ matrix.recovery }} for fire
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - recovery: OrangeFox
            lunch_prefix: fox
            manifest_url: https://gitlab.com/OrangeFox/sync.git
            vendor_check: vendor/fox/config/common.mk
            vendor_repo: https://gitlab.com/OrangeFox/vendor/recovery.git
            vendor_branch: fox_12.1
            vendor_path: vendor/fox
            build_cmd: mka adbd vendorbootimage
            zip_pattern: "OrangeFox*.zip"
            skip_if: ${{ github.event_name == 'workflow_dispatch' && inputs.BUILD_TARGET == 'twrp' }}

          - recovery: TWRP
            lunch_prefix: twrp
            manifest_url: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git
            vendor_check: ""
            vendor_repo: ""
            vendor_branch: ""
            vendor_path: ""
            build_cmd: mka adbd vendorbootimage
            zip_pattern: "twrp*.zip"
            skip_if: ${{ github.event_name == 'workflow_dispatch' && inputs.BUILD_TARGET == 'orangefox' }}

    env:
      DEVICE_CODENAME: fire
      DEVICE_PATH: device/xiaomi/fire
      MANIFEST_BRANCH: 12.1
      FOX_VENDOR_BRANCH: fox_12.1
      SOC_FAMILY: mtk

    steps:
      - name: Skip check
        if: matrix.skip_if
        run: |
          echo "Skipping ${{ matrix.recovery }} build as per user selection"
          exit 0

      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: ${{ env.DEVICE_PATH }}

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
                      /opt/ghc /usr/local/.ghcup
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
            libncurses5 lib32ncurses5-dev x11proto-core-dev \
            libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils \
            xsltproc unzip fontconfig python3 python3-pip bc \
            lzop pngcrush rsync schedtool ccache openjdk-11-jdk aria2

      - name: Configure git
        run: |
          git config --global user.name "AKRO-Build"
          git config --global user.email "build@localhost"
          git config --global color.ui false

      - name: Install repo
        run: |
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo \
            -o ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Setup build environment
        run: |
          if [ "${{ matrix.recovery }}" = "OrangeFox" ]; then
            git clone https://gitlab.com/OrangeFox/misc/scripts /tmp/ofox_scripts
            cd /tmp/ofox_scripts
            sudo bash setup/android_build_env.sh
          else
            sudo apt-get install -y --no-install-recommends \
              libssl-dev repo python-is-python3
          fi

      - name: Init and Sync manifest
        run: |
          mkdir -p $GITHUB_WORKSPACE/src
          if [ "${{ matrix.recovery }}" = "OrangeFox" ]; then
            git clone https://gitlab.com/OrangeFox/sync.git /tmp/ofox_sync
            cd /tmp/ofox_sync
            mkdir -p $GITHUB_WORKSPACE/src/${{ env.DEVICE_PATH }}
            cp -r $GITHUB_WORKSPACE/${{ env.DEVICE_PATH }}/. \
              $GITHUB_WORKSPACE/src/${{ env.DEVICE_PATH }}/
            ./orangefox_sync.sh \
              --branch ${{ env.MANIFEST_BRANCH }} \
              --path $GITHUB_WORKSPACE/src
          else
            cd $GITHUB_WORKSPACE/src
            repo init -u ${{ matrix.manifest_url }} \
              -b twrp-${{ env.MANIFEST_BRANCH }} \
              --depth=1
            repo sync -j$(nproc) --force-sync
          fi

      # ── FIX: mkdir -p before cp to avoid "No such file or directory" ──
      - name: Place device tree (force overwrite after sync)
        run: |
          DEST="$GITHUB_WORKSPACE/src/${{ env.DEVICE_PATH }}"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -r "$GITHUB_WORKSPACE/${{ env.DEVICE_PATH }}/." "$DEST/"
          rm -rf "$DEST/.git"
          echo "=== Device tree files ==="
          ls -la "$DEST/"

      # ── FIX: explicit vendor/fox clone; print structure on failure ──
      - name: Verify vendor/fox exists (OrangeFox only)
        if: matrix.recovery == 'OrangeFox'
        run: |
          VENDOR_PATH="$GITHUB_WORKSPACE/src/vendor/fox"
          FOX_COMMON="$VENDOR_PATH/config/common.mk"

          if [ -f "$FOX_COMMON" ]; then
            echo "vendor/fox/config/common.mk found (sync provided it)"
            exit 0
          fi

          echo "::warning::vendor/fox not found after sync, cloning explicitly..."
          rm -rf "$VENDOR_PATH"
          mkdir -p "$GITHUB_WORKSPACE/src/vendor"

          if git clone --depth=1 -b ${{ matrix.vendor_branch }} \
              ${{ matrix.vendor_repo }} \
              "$VENDOR_PATH"; then
            echo "Clone success: ${{ matrix.vendor_branch }}"
          elif git clone --depth=1 -b ${{ env.MANIFEST_BRANCH }} \
              ${{ matrix.vendor_repo }} \
              "$VENDOR_PATH"; then
            echo "Clone success: ${{ env.MANIFEST_BRANCH }}"
          else
            echo "::error::Failed to clone vendor/fox"
            exit 1
          fi

          if [ ! -f "$FOX_COMMON" ]; then
            echo "=== vendor/fox structure (debug) ==="
            find "$VENDOR_PATH" -maxdepth 4 | head -40
            echo "::error::vendor/fox/config/common.mk still missing after clone"
            exit 1
          fi

          echo "vendor/fox OK"

      - name: Apply MSMS decryption patches
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.SYNC_MSMS == true && env.SOC_FAMILY == 'msm' }}
        working-directory: src
        run: |
          cd bootable/recovery
          git remote add ofox-upstream \
            https://gitlab.com/OrangeFox/bootable/Recovery.git 2>/dev/null || true
          git fetch ofox-upstream fox_${{ env.MANIFEST_BRANCH }} --depth=1
          echo "OrangeFox Recovery upstream fetched."

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 2G
          key: ${{ matrix.lunch_prefix }}-fire-${{ env.MANIFEST_BRANCH }}

      - name: Build ${{ matrix.recovery }}
        working-directory: src
        run: |
          export USE_CCACHE=1
          export CCACHE_EXEC=$(which ccache)
          export CCACHE_DIR=/tmp/ccache
          export ALLOW_MISSING_DEPENDENCIES=true
          export BUILD_BROKEN_USES_BUILD_COPY_HEADERS=true
          export BUILD_BROKEN_VENDOR_PROPERTY_NAMESPACE=true
          set +e
          source build/envsetup.sh
          set -e
          lunch ${{ matrix.lunch_prefix }}_${{ env.DEVICE_CODENAME }}-eng
          ${{ matrix.build_cmd }} -j$(nproc) 2>&1 | tee /tmp/build.log
          BUILD_EXIT=${PIPESTATUS[0]}

          echo "=== BUILD ERRORS & WARNINGS ===" > /tmp/build_errors.log
          echo "[${{ matrix.recovery }}] Run #${{ github.run_number }} — $(date)" >> /tmp/build_errors.log
          echo "========================================" >> /tmp/build_errors.log
          grep -iE "^(.*error:|.*warning:|make:|FAILED:|ninja:|fatal:)" /tmp/build.log \
            >> /tmp/build_errors.log || true
          echo "" >> /tmp/build_errors.log
          echo "=== LAST 100 LINES ===" >> /tmp/build_errors.log
          tail -100 /tmp/build.log >> /tmp/build_errors.log

          exit $BUILD_EXIT

      - name: Check output files
        run: |
          OUT_DIR="$GITHUB_WORKSPACE/src/out/target/product/${{ env.DEVICE_CODENAME }}"
          echo "OUT_DIR=$OUT_DIR" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV

          echo "=== Files in OUT_DIR ==="
          ls -lh "$OUT_DIR/" || echo "OUT_DIR not found!"

          if [ -f "$OUT_DIR/vendor_boot.img" ]; then
            echo "CHECK_VENDOR_BOOT=true" >> $GITHUB_ENV
            echo "MD5_IMG=$(md5sum $OUT_DIR/vendor_boot.img | cut -d ' ' -f 1)" >> $GITHUB_ENV
            echo "vendor_boot.img found"
          else
            echo "CHECK_VENDOR_BOOT=false" >> $GITHUB_ENV
            echo "::error::vendor_boot.img NOT found!"
          fi

          if ls "$OUT_DIR"/${{ matrix.zip_pattern }} 2>/dev/null; then
            echo "CHECK_ZIP=true" >> $GITHUB_ENV
            echo "MD5_ZIP=$(md5sum $OUT_DIR/${{ matrix.zip_pattern }} | cut -d ' ' -f 1)" >> $GITHUB_ENV
            echo "zip found"
          else
            echo "CHECK_ZIP=false" >> $GITHUB_ENV
            echo "::warning::zip not found"
          fi

      - name: Upload recovery artifact
        if: env.CHECK_VENDOR_BOOT == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.recovery }}-${{ env.MANIFEST_BRANCH }}-fire-AKRO-${{ env.BUILD_DATE }}
          path: |
            ${{ env.OUT_DIR }}/vendor_boot.img
            ${{ env.OUT_DIR }}/${{ matrix.zip_pattern }}
          if-no-files-found: warn
          retention-days: 7

      - name: Upload build errors log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-errors-${{ matrix.lunch_prefix }}-fire-${{ github.run_number }}
          path: /tmp/build_errors.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Collect all logs on failure
        if: failure()
        run: |
          mkdir -p /tmp/fail_logs
          [ -f /tmp/build.log ]        && cp /tmp/build.log        /tmp/fail_logs/ || true
          [ -f /tmp/build_errors.log ] && cp /tmp/build_errors.log /tmp/fail_logs/ || true
          find $GITHUB_WORKSPACE/src/out -name "*.log" 2>/dev/null \
            | head -20 \
            | xargs -I{} sh -c 'cp "{}" /tmp/fail_logs/$(basename "{}")' || true
          echo "=== ENV DUMP ===" > /tmp/fail_logs/env.log
          env >> /tmp/fail_logs/env.log

      - name: Upload all logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.lunch_prefix }}-fire-${{ github.run_number }}
          path: /tmp/fail_logs/
          retention-days: 7

      - name: Create GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' && env.CHECK_VENDOR_BOOT == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: AKRO-${{ matrix.recovery }}-${{ github.run_number }}
          name: "${{ matrix.recovery }} Redmi 12 (fire) by AKRO #${{ github.run_number }}"
          fail_on_unmatched_files: false
          body: |
            **Device:** Redmi 12 (fire) — MT6768
            **Recovery:** ${{ matrix.recovery }}
            **ROM Base:** HyperOS OS2.0.207.0.VMXMIXM (Android 15)
            **Branch:** ${{ env.MANIFEST_BRANCH }}
            **Maintainer:** AKRO — UNOFFICIAL
            **Date:** ${{ env.BUILD_DATE }}
            **MD5 (vendor_boot):** ${{ env.MD5_IMG }}
            **MD5 (zip):** ${{ env.MD5_ZIP }}

            ### Flash
            ```
            fastboot flash vendor_boot vendor_boot.img
            ```
            - A/B device — recovery inside vendor_boot
            - FBE decryption for HyperOS 2 / Android 15
          files: |
            ${{ env.OUT_DIR }}/vendor_boot.img
            ${{ env.OUT_DIR }}/${{ matrix.zip_pattern }}
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
